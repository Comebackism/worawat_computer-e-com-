# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repository.
# Render then creates both resources below and wires the connection string into
# the web service, so no secrets are baked into this file or the repository.

databases:
  # The API keeps its whole dataset in this database (see server/data/store.js).
  # Free Render Postgres expires 30 days after creation - upgrade the plan for
  # anything you want to keep.
  - name: worawat-computer-db
    plan: free
    region: singapore
    databaseName: worawat
    user: worawat

services:
  - type: web
    name: worawat-computer
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    # The storefront is built first, then Express serves dist/ and /api from the
    # same origin, so the frontend keeps using relative /api URLs.
    buildCommand: npm ci && npm --prefix server ci && npm run build
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: worawat-computer-db
          property: connectionString
      # Signs the session cookie. Render generates a strong value on first deploy.
      - key: AUTH_SECRET
        generateValue: true
      # Admin credentials. Set ADMIN_PASSWORD in the dashboard so the account
      # never keeps a demo password; leaving it unset keeps the existing one.
      - key: ADMIN_EMAIL
        value: admin@worawat.com
      - key: ADMIN_PASSWORD
        sync: false
      # Optional Google Sign-In. Leave both empty to use the client ID already
      # baked into src/lib/google.js and server/index.js, in which case add this
      # service's URL to that client's authorised JavaScript origins.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
